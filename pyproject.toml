[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goofish-cli"
version = "0.4.0"
description = "闲鱼与飞书双向回复助手。"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "fancy", email = "saral96@mail.com" }]
keywords = ["xianyu", "goofish", "feishu", "reply", "bridge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "requests>=2.31",
  "loguru>=0.7",
  "typer>=0.12",
  "pyexecjs>=1.5",
  "rich>=13.7",
  "pyyaml>=6.0",
  "websockets>=13",
  "browser-cookie3>=0.20",
  "playwright>=1.58.0",
  "cryptography>=41.0",
  "lark-oapi==1.6.8",
  "python-dotenv==1.2.2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
goofish = "goofish_cli.cli:app"

[project.urls]
Homepage = "https://github.com/fancyboi999/goofish-cli"
Repository = "https://github.com/fancyboi999/goofish-cli"
Issues = "https://github.com/fancyboi999/goofish-cli/issues"
Changelog = "https://github.com/fancyboi999/goofish-cli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/goofish_cli", "src/goofish_bridge"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
  "docs/",
  "scripts/",
  "tests/",
  "config.example.yaml",
  ".env.example",
  "uv.lock",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
